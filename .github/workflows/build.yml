name: Build

on:
  release:
    types: [created]
  workflow_dispatch: {} # lets you test this from the Actions tab without cutting a real release

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:

  # ── Windows ──────────────────────────────────────────────────────────────
  # Packaged with Inno Setup (preinstalled on windows-latest runners) into a
  # single installer .exe -- the closest Flutter equivalent to a PyInstaller
  # --onefile build. See windows/installer.iss and Docs/future_work.md.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss'
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuillFin-Windows-Setup
          path: windows/installer_output/QuillFin-Windows-Setup.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: windows/installer_output/QuillFin-Windows-Setup.exe

  # ── Linux x86_64 ─────────────────────────────────────────────────────────
  # Built on Ubuntu 22.04 for broad glibc compatibility with older distros,
  # packaged as a single-file AppImage -- the closest Linux equivalent to a
  # PyInstaller --onefile build (genuinely one portable executable, not an
  # archive the user has to extract first).
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config libfuse2 file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR="QuillFin.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp linux/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp linux/appimage/quillfin.desktop "$APPDIR/quillfin.desktop"
          cp linux/appimage/icon.png "$APPDIR/icon.png"

      - name: Download appimagetool
        run: |
          curl -L -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          # GitHub Actions runners don't have FUSE mounted, so appimagetool
          # (itself an AppImage) needs to extract-and-run rather than mount.
          ./appimagetool --appimage-extract-and-run QuillFin.AppDir QuillFin-Linux-x86_64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuillFin-Linux-x86_64.AppImage
          path: QuillFin-Linux-x86_64.AppImage

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: QuillFin-Linux-x86_64.AppImage
