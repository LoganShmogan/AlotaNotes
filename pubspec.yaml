name: quillfin
description: "QuillFin by Save Point: notes, quizzes and practice problems scheduled with FSRS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  file_picker: ^8.1.6
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdf: ^27.2.5
  share_plus: ^10.1.3
  sqflite_common_ffi_web: ^1.2.0
  shared_preferences: ^2.5.5
  sqflite_common_ffi: ^2.4.3
  fsrs: ^2.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  app_links: ^7.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  markdown: ^7.2.2
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.1
  share_plus_platform_interface: ^5.0.2
  path_provider_platform_interface: ^2.1.2
  url_launcher_platform_interface: ^2.3.2
flutter:
  uses-material-design: true

  # Placeholder QuillFin brand fonts (see lib/theme/brand.dart), bundled so
  # text never needs a network fetch. Both SIL OFL (licences alongside).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
